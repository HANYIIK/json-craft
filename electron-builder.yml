appId: dev.jsoncraft.desktop
productName: JSON Craft
copyright: Copyright © 2026 JSON Craft contributors
directories:
  output: release
  buildResources: resources/icons
files:
  - dist/**
  - electron/**
  - src/locales/*.json
  - resources/icons/icon.png
  - package.json
  - "!node_modules/**"
asar: true
npmRebuild: false
forceCodeSigning: false
publish: null
mac:
  icon: resources/icons/icon.icns
  category: public.app-category.developer-tools
  artifactName: JSON-Craft-${version}-macOS-${arch}.${ext}
  target: [dmg, zip]
  identity: "-"
  hardenedRuntime: false
  gatekeeperAssess: false
  notarize: false
  minimumSystemVersion: "13.0"
dmg:
  title: JSON Craft
  sign: false
win:
  icon: resources/icons/icon.ico
  artifactName: JSON-Craft-${version}-Windows-${arch}.${ext}
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: JSON Craft
  runAfterFinish: false
fileAssociations:
  - ext: json
    name: JSON document
    description: JSON document
    role: Editor
    rank: Alternate
