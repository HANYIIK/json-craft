name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v0.1.0
        required: true
        type: string
      draft:
        description: Create or retain a draft instead of publishing immediately
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag syntax
        id: tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Use a semantic version tag such as v0.1.0.' >&2
            exit 1
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check existing tag and package version
        shell: bash
        run: |
          git show-ref --verify "refs/tags/$RELEASE_TAG"
          node -e 'const p=require("./package.json"); if ("v"+p.version !== process.env.RELEASE_TAG) { console.error("Tag must match package.json version"); process.exit(1); }'

  build:
    name: Package ${{ matrix.platform }} ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: windows-2025
            platform: win
            arch: x64
          - os: windows-11-arm
            platform: win
            arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build installers
        shell: bash
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ matrix.platform == 'mac' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'mac' && secrets.APPLE_TEAM_ID || '' }}
        run: |
          args=("--$BUILD_PLATFORM" "--$BUILD_ARCH" --publish never)
          export CSC_IDENTITY_AUTO_DISCOVERY=false
          if [[ -n "$CSC_LINK" ]]; then
            export CSC_IDENTITY_AUTO_DISCOVERY=true
          fi
          if [[ "$BUILD_PLATFORM" == mac && -n "$CSC_LINK" ]]; then
            args+=(--config.mac.identity= --config.mac.type=distribution --config.mac.hardenedRuntime=true --config.forceCodeSigning=true)
          fi
          if [[ "$BUILD_PLATFORM" == win && -n "$CSC_LINK" ]]; then
            args+=(--config.forceCodeSigning=true)
          fi
          if [[ "$BUILD_PLATFORM" == mac && -n "$CSC_LINK" && -n "$APPLE_ID" && -n "$APPLE_APP_SPECIFIC_PASSWORD" && -n "$APPLE_TEAM_ID" ]]; then
            args+=(--config.mac.notarize=true)
          fi
          npx electron-builder "${args[@]}"
      - name: Verify macOS DMG and ZIP installation and launch
        if: matrix.platform == 'mac'
        shell: bash
        env:
          REQUIRE_CODE_SIGNING: ${{ secrets.MAC_CSC_LINK != '' }}
          REQUIRE_NOTARIZATION: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
        run: bash scripts/packaging/verify-macos.sh "${{ matrix.arch }}"
      - name: Verify Windows installer and installed application
        if: matrix.platform == 'win'
        shell: pwsh
        env:
          REQUIRE_CODE_SIGNING: ${{ secrets.WIN_CSC_LINK != '' }}
        run: ./scripts/packaging/verify-windows.ps1 -Architecture "${{ matrix.arch }}"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: installers-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.blockmap

  publish-release:
    name: Assemble and publish release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.validate.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: installers-*
          merge-multiple: true
          path: release-assets
      - name: Verify complete set of installers
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          node --input-type=module <<'NODE'
          import { stat } from 'node:fs/promises';
          const version = process.env.RELEASE_TAG.slice(1);
          const expected = [
            ...['x64', 'arm64'].flatMap(arch => ['dmg', 'zip'].map(ext => `JSON-Craft-${version}-macOS-${arch}.${ext}`)),
            ...['x64', 'arm64'].map(arch => `JSON-Craft-${version}-Windows-${arch}.exe`),
          ];
          await Promise.all(expected.map(async name => {
            const file = await stat(`release-assets/${name}`);
            if (!file.isFile() || file.size === 0) throw new Error(`Missing or empty installer: ${name}`);
          }));
          NODE
      - name: Generate SHA-256 checksums
        working-directory: release-assets
        run: sha256sum JSON-Craft-* > SHA256SUMS
      - name: Create or publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_DRAFT: ${{ github.event_name == 'workflow_dispatch' && inputs.draft && 'true' || 'false' }}
          MAC_SIGNED: ${{ secrets.MAC_CSC_LINK != '' }}
          MAC_NOTARIZED: ${{ secrets.MAC_CSC_LINK != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
          WINDOWS_SIGNED: ${{ secrets.WIN_CSC_LINK != '' }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFile } from 'node:fs/promises';
          import path from 'node:path';
          const url = `https://github.com/${process.env.GITHUB_REPOSITORY}/blob/${process.env.RELEASE_TAG}`;
          const mac = process.env.MAC_NOTARIZED === 'true'
            ? 'Developer ID signed and Apple-notarized.'
            : process.env.MAC_SIGNED === 'true'
              ? 'Developer ID signed; not Apple-notarized.'
              : 'Ad-hoc signed; not Apple-notarized.';
          const windows = process.env.WINDOWS_SIGNED === 'true'
            ? 'Publisher-signed.'
            : 'No publisher certificate; Windows may show an unknown-publisher or SmartScreen prompt.';
          const body = [
            '# JSON Craft',
            '',
            'A local desktop JSON workbench to format, repair, recursively unescape, extract values, and review repair differences.',
            '',
            `[English guide](${url}/README.md) · [中文指南](${url}/README.zh-CN.md)`,
            '',
            '## Downloads and installation',
            '',
            '- macOS 13 or later: choose arm64 for Apple Silicon or x64 for Intel; install from the DMG or unzip the ZIP.',
            '- Windows 10 or later: choose the x64 or ARM64 installer for your processor.',
            '- SHA256SUMS contains checksums for all installers.',
            '',
            `macOS: ${mac}`,
            `Windows: ${windows}`,
            '',
            'If macOS blocks the first launch and you trust the download, follow [Apple’s Privacy & Security → Open Anyway instructions](https://support.apple.com/en-us/102445).',
            '',
          ].join('\n');
          await writeFile(path.join(process.env.RUNNER_TEMP, 'json-craft-release-notes.md'), body);
          NODE
          if gh release view "$RELEASE_TAG" --json isDraft > "$RUNNER_TEMP/json-craft-release.json"; then
            node -e 'if (!require(process.env.RUNNER_TEMP+"/json-craft-release.json").isDraft) { console.error("Refusing to replace assets on a published release"); process.exit(1); }'
            gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/json-craft-release-notes.md"
          else
            args=(--verify-tag --title "JSON Craft $RELEASE_TAG" --notes-file "$RUNNER_TEMP/json-craft-release-notes.md" --draft)
            if [[ "$RELEASE_TAG" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          release_api="$(gh release view "$RELEASE_TAG" --json apiUrl --jq .apiUrl)"
          gh api "$release_api" > "$RUNNER_TEMP/json-craft-release.json"
          node scripts/packaging/verify-release-assets.mjs "$RUNNER_TEMP/json-craft-release.json" release-assets
          if [[ "$RELEASE_DRAFT" != true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false
          fi
